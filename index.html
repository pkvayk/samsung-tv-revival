<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Samsung TV Revival</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#101827,#182b40);color:white;font-family:Arial,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;color:#c9d8e9}h1{font-size:clamp(28px,5vw,56px);margin:75px 0 8px}p{color:#aebed0}.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:35px}.app{border:2px solid transparent;border-radius:20px;min-height:150px;color:white;font-size:clamp(20px,3vw,34px);font-weight:bold;cursor:pointer;transition:transform .12s;background:#303d53}.app:focus,.app.selected{outline:3px solid #f5d47a;outline-offset:3px;transform:scale(1.02)}.youtube{background:#c82932}.netflix{background:#161616}.prime{background:#136c99}.disney{background:#183c7d}#status{min-height:28px;margin-top:30px;color:#f5d47a}footer{color:#94a8c0;margin-top:45px;font-size:14px}@media(min-width:800px){.apps{grid-template-columns:repeat(4,1fr)}.app{min-height:190px}}@media(max-width:500px){main{padding:24px 18px}h1{margin-top:50px}.app{min-height:120px}}
</style></head><body><main><header><strong>◈ TV REVIVAL <small>v1.0</small></strong><span id="clock">--:--</span></header><h1>Selamat datang di rumah.</h1><p>Pilih hiburan keluarga. Mode demo — belum terhubung ke Samsung TV.</p><section class="apps" id="apps"><button class="app youtube" data-name="YouTube Kids">▶ Kids</button><button class="app netflix" data-name="Netflix">NETFLIX</button><button class="app prime" data-name="Prime Video">prime video</button><button class="app disney" data-name="Disney+">Disney+</button></section><div id="status" role="status" aria-live="polite">Gunakan sentuhan atau tombol panah dan Enter.</div><footer>Samsung TV Revival • Prototype iPad/iPhone • Tidak mengubah firmware TV</footer></main><script>
(function(){var buttons=[].slice.call(document.querySelectorAll('.app'));var index=0;var status=document.getElementById('status');function select(i){index=(i+buttons.length)%buttons.length;buttons[index].focus()}function activate(b){status.textContent=b.getAttribute('data-name')+' dipilih. Integrasi aplikasi TV belum aktif.'}buttons.forEach(function(b,i){b.addEventListener('click',function(){index=i;activate(b)});b.addEventListener('focus',function(){index=i})});document.addEventListener('keydown',function(e){var next=index;if(e.key==='ArrowRight')next=index+1;else if(e.key==='ArrowLeft')next=index-1;else if(e.key==='ArrowDown')next=index+2;else if(e.key==='ArrowUp')next=index-2;else if(e.key==='Enter'){activate(buttons[index]);return}else{return}e.preventDefault();select(next)});function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000)})();
</script></body></html>
